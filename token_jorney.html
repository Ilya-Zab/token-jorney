<style>
  :root {
    /* Neutral */
    --gray-0: #ffffff;
    --gray-50: #f9fafb;
    --gray-100: #f3f4f6;
    --gray-200: #e5e7eb;
    --gray-400: #9ca3af;
    --gray-600: #4b5563;
    --gray-800: #1f2937;

    /* Blue (info) */
    --blue-100: #e0f2fe;
    --blue-300: #93c5fd;
    --blue-700: #1d4ed8;

    /* Green (success) */
    --green-100: #ecfdf5;
    --green-300: #6ee7b7;
    --green-700: #065f46;

    /* Orange (optional highlight) */
    --orange-100: #faeeda;
    --orange-400: #ef9f27;
    --orange-800: #633806;

    /* Semantic */
    --text-primary: #e5e7eb;
    --text-secondary: #9ca3af;

    --text-info: #93c5fd;
    --text-success: #6ee7b7;

    --bg-page: #111827;
    --bg-subtle: #1f2937;

    --bg-info: #1e3a8a;
    --bg-success: #064e3b;

    --border-default: #4b5563;
    --border-subtle: #374151;

    --border-info: #3b82f6;
    --border-success: #10b981;
  }

  body {
    background: var(--bg-page);
    color: var(--text-primary);
  }

  .stage-wrap {
    padding: 1rem 0;
    font-size: 14px;
  }

  .stage-nav {
    display: flex;
    gap: 6px;
    flex-wrap: wrap;
    margin-bottom: 1.25rem;
  }

  .snav-btn {
    padding: 5px 12px;
    border-radius: 20px;
    border: 0.5px solid var(--border-default);
    background: var(--bg-subtle);
    color: var(--text-secondary);
    cursor: pointer;
    font-size: 12px;
    transition: all 0.15s;
    white-space: nowrap;
  }

  .snav-btn.active {
    background: var(--bg-info);
    border-color: var(--border-info);
    color: var(--text-info);
    font-weight: 500;
  }

  h3 {
    font-size: 15px;
    font-weight: 500;
    margin: 0 0 6px;
  }

  p {
    margin: 0 0 10px;
    line-height: 1.65;
    color: var(--text-secondary);
    font-size: 13px;
  }

  .tokens {
    display: flex;
    gap: 4px;
    flex-wrap: wrap;
    margin: 10px 0;
    align-items: center;
  }

  .tok {
    padding: 5px 11px;
    border-radius: 6px;
    font-size: 13px;
    font-weight: 500;
    border: 0.5px solid;
  }

  .tok.t-raw {
    background: var(--bg-subtle);
    border-color: var(--border-default);
    color: var(--text-secondary);
  }

  .tok.t-id {
    background: var(--bg-info);
    border-color: var(--border-info);
    color: var(--text-info);
    font-family: monospace;
  }

  .tok.t-vec {
    background: var(--bg-success);
    border-color: var(--border-success);
    color: var(--text-success);
    font-family: monospace;
    font-size: 11px;
  }

  .arrow-row {
    text-align: center;
    font-size: 18px;
    color: var(--text-secondary);
    margin: 4px 0;
  }

  .label {
    font-size: 11px;
    color: var(--text-secondary);
    margin-bottom: 4px;
  }

  .layer-stack {
    display: flex;
    flex-direction: column;
    gap: 4px;
    margin: 10px 0;
  }

  .layer {
    border-radius: 8px;
    padding: 8px 14px;
    font-size: 13px;
    border: 0.5px solid;
    display: flex;
    align-items: center;
    justify-content: space-between;
  }

  .layer.norm {
    background: var(--bg-subtle);
    border-color: var(--border-default);
    color: var(--text-secondary);
  }

  .layer.attn {
    background: var(--bg-info);
    border-color: var(--border-info);
    color: var(--text-info);
  }

  .layer.ffn {
    background: var(--bg-success);
    border-color: var(--border-success);
    color: var(--text-success);
  }

  .layer-note {
    font-size: 11px;
    opacity: 0.8;
  }

  .prob-row {
    display: flex;
    align-items: center;
    gap: 8px;
    margin: 5px 0;
    font-size: 13px;
  }

  .prob-bar-wrap {
    flex: 1;
    height: 10px;
    background: var(--bg-subtle);
    border-radius: 5px;
    overflow: hidden;
  }

  .prob-bar {
    height: 100%;
    border-radius: 5px;
    background: var(--bg-info);
    transition: width 0.4s;
  }

  .prob-bar.top {
    background: var(--text-success);
  }

  .prob-word {
    width: 80px;
    font-family: monospace;
    font-size: 12px;
    color: var(--text-primary);
  }

  .prob-pct {
    width: 38px;
    text-align: right;
    font-size: 12px;
    color: var(--text-secondary);
  }

  .highlight-box {
    background: var(--bg-success);
    border: 0.5px solid var(--border-success);
    border-radius: 8px;
    padding: 10px 14px;
    font-size: 13px;
    color: var(--text-success);
    margin: 10px 0;
  }

  .info-box {
    background: var(--bg-subtle);
    border: 0.5px solid var(--border-default);
    border-radius: 8px;
    padding: 10px 14px;
    font-size: 13px;
    color: var(--text-secondary);
    margin: 10px 0;
    line-height: 1.6;
  }

  .vec-grid {
    display: grid;
    grid-template-columns: repeat(8, 1fr);
    gap: 3px;
    margin: 8px 0;
  }

  .vec-cell {
    height: 18px;
    border-radius: 3px;
    background: var(--bg-subtle);
  }
</style>

<div class="stage-wrap">
  <div class="stage-nav" id="nav"></div>
  <div id="content"></div>
</div>

<script>
  const stages = [
    {
      label: "1. Your prompt",
      render() {
        return `
        <h3>Your raw text arrives</h3>
        <p>You type a message. The model never sees this directly — it must be converted to numbers first.</p>
        <div class="tokens">
          <span class="tok t-raw">Tell</span>
          <span class="tok t-raw">Ġme</span>
          <span class="tok t-raw">Ġa</span>
          <span class="tok t-raw">Ġjoke</span>
        </div>
        <div class="info-box">The <strong>Ġ</strong> symbol is GPT-2's way of marking a space before a word — this is the byte-level BPE trick from earlier. "me" and " me" become different tokens.</div>
      `;
      },
    },
    {
      label: "2. BPE tokenization",
      render() {
        return `
        <h3>Text → token IDs</h3>
        <p>The frozen tokenizer applies its learned merge rules and maps each token to an integer ID from the vocabulary.</p>
        <div class="label">Raw tokens</div>
        <div class="tokens">
          <span class="tok t-raw">Tell</span>
          <span class="tok t-raw">Ġme</span>
          <span class="tok t-raw">Ġa</span>
          <span class="tok t-raw">Ġjoke</span>
        </div>
        <div class="arrow-row">↓</div>
        <div class="label">Integer IDs (indices into the vocabulary table)</div>
        <div class="tokens">
          <span class="tok t-id">24446</span>
          <span class="tok t-id">502</span>
          <span class="tok t-id">257</span>
          <span class="tok t-id">8523</span>
        </div>
        <p style="margin-top:10px">These IDs are the only thing that enters the model. The vocabulary has ~50,000 rows — one per possible token.</p>
      `;
      },
    },
    {
      label: "3. Embedding lookup",
      render() {
        const colors = [
          "#7F77DD",
          "#534AB7",
          "#1D9E75",
          "#0F6E56",
          "#EF9F27",
          "#BA7517",
          "#D85A30",
          "#993C1D",
        ];
        return `
        <h3>IDs → vectors (embeddings)</h3>
        <p>Each integer ID is looked up in a giant table — the <strong>embedding matrix</strong>. Each row is a vector of ~4,000 numbers that represents that token's meaning.</p>
        <div class="tokens" style="margin-bottom:6px">
          <span class="tok t-id">24446</span>
          <span style="font-size:12px;color:var(--color-text-secondary)">→</span>
          <span class="tok t-vec">[0.21, −0.08, 0.54, 0.03, ...]</span>
        </div>
        <div class="tokens" style="margin-bottom:6px">
          <span class="tok t-id">502</span>
          <span style="font-size:12px;color:var(--color-text-secondary)">→</span>
          <span class="tok t-vec">[−0.11, 0.76, 0.02, −0.44, ...]</span>
        </div>
        <div class="tokens" style="margin-bottom:6px">
          <span class="tok t-id">257</span>
          <span style="font-size:12px;color:var(--color-text-secondary)">→</span>
          <span class="tok t-vec">[0.33, 0.09, −0.61, 0.17, ...]</span>
        </div>
        <div class="tokens">
          <span class="tok t-id">8523</span>
          <span style="font-size:12px;color:var(--color-text-secondary)">→</span>
          <span class="tok t-vec">[0.05, −0.39, 0.28, 0.81, ...]</span>
        </div>
        <div class="info-box" style="margin-top:10px">Think of each vector as a point in high-dimensional space. Tokens with similar meaning end up geometrically close. "king" − "man" + "woman" ≈ "queen" — that kind of thing. These vectors are what the model actually computes on.</div>
      `;
      },
    },
    {
      label: "4. Transformer layers",
      render() {
        return `
        <h3>Vectors pass through N transformer layers</h3>
        <p>Each layer has two jobs. It runs on all tokens simultaneously, in parallel.</p>
        <div class="layer-stack">
          <div class="layer norm"><span>Layer norm</span><span class="layer-note">stabilises the numbers</span></div>
          <div class="layer attn"><span>Self-attention</span><span class="layer-note">tokens look at each other</span></div>
          <div class="layer norm"><span>Layer norm</span><span class="layer-note">stabilises again</span></div>
          <div class="layer ffn"><span>Feed-forward network</span><span class="layer-note">per-token transformation</span></div>
        </div>
        <p>This block repeats 32–96 times depending on the model size. Each repetition lets the model understand deeper relationships.</p>
        <div class="highlight-box">After all layers, each token's vector now encodes not just its own meaning, but its meaning <em>in context</em> of all the other tokens around it. "bank" next to "river" is now a completely different vector than "bank" next to "money".</div>
      `;
      },
    },
    {
      label: "5. Attention (zoom in)",
      render() {
        return `
        <h3>What self-attention actually does</h3>
        <p>For each token, attention asks: <em>"which other tokens should I pay attention to when updating my own meaning?"</em></p>
        <div style="margin: 10px 0">
          <div class="label">Processing the token "joke" — it attends to:</div>
          <div class="prob-row"><span class="prob-word">Tell</span><div class="prob-bar-wrap"><div class="prob-bar" style="width:15%"></div></div><span class="prob-pct">15%</span></div>
          <div class="prob-row"><span class="prob-word">me</span><div class="prob-bar-wrap"><div class="prob-bar" style="width:12%"></div></div><span class="prob-pct">12%</span></div>
          <div class="prob-row"><span class="prob-word">a</span><div class="prob-bar-wrap"><div class="prob-bar" style="width:8%"></div></div><span class="prob-pct">8%</span></div>
          <div class="prob-row"><span class="prob-word">joke</span><div class="prob-bar-wrap"><div class="prob-bar top" style="width:65%"></div></div><span class="prob-pct">65%</span></div>
        </div>
        <p>These weights are computed from the vectors themselves — the model learns which patterns to look for during training. This is how the model understands grammar, coreference ("she" → "Alice"), and long-range dependencies.</p>
        <div class="info-box">In practice there are many attention "heads" running in parallel, each potentially capturing a different type of relationship (syntax, semantics, position, etc.).</div>
      `;
      },
    },
    {
      label: "6. Output & sampling",
      render() {
        return `
        <h3>Final layer → probability over the whole vocabulary</h3>
        <p>The last token's vector goes through a linear layer + softmax. This produces a probability for every token in the vocabulary — ~50,000 numbers that sum to 1.</p>
        <div class="label">Top candidates for the next token after "Tell me a joke":</div>
        <div style="margin: 8px 0">
          <div class="prob-row"><span class="prob-word">"about"</span><div class="prob-bar-wrap"><div class="prob-bar top" style="width:28%"></div></div><span class="prob-pct">28%</span></div>
          <div class="prob-row"><span class="prob-word">"—"</span><div class="prob-bar-wrap"><div class="prob-bar" style="width:18%"></div></div><span class="prob-pct">18%</span></div>
          <div class="prob-row"><span class="prob-word">"that"</span><div class="prob-bar-wrap"><div class="prob-bar" style="width:13%"></div></div><span class="prob-pct">13%</span></div>
          <div class="prob-row"><span class="prob-word">"for"</span><div class="prob-bar-wrap"><div class="prob-bar" style="width:9%"></div></div><span class="prob-pct">9%</span></div>
          <div class="prob-row"><span class="prob-word">...</span><div class="prob-bar-wrap"><div class="prob-bar" style="width:32%"></div></div><span class="prob-pct">32%</span></div>
        </div>
        <p>One token is sampled from this distribution. That token is appended to the input, and the whole forward pass runs again to get the next token. This is why generation is slow — it's one token at a time.</p>
        <div class="highlight-box">Temperature controls how "sharp" this distribution is. Low temperature = always pick the top token (deterministic). High temperature = more random sampling = more creative but less coherent.</div>
      `;
      },
    },
  ];

  const nav = document.getElementById("nav");
  const content = document.getElementById("content");
  let cur = 0;

  function render(i) {
    cur = i;
    nav
      .querySelectorAll(".snav-btn")
      .forEach((b, j) => b.classList.toggle("active", j === i));
    content.innerHTML = stages[i].render();
  }

  stages.forEach((s, i) => {
    const btn = document.createElement("button");
    btn.className = "snav-btn" + (i === 0 ? " active" : "");
    btn.textContent = s.label;
    btn.onclick = () => render(i);
    nav.appendChild(btn);
  });

  render(0);
</script>
